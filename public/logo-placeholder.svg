<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" fill="none">
  <!-- 911 CAFE LOGO PLACEHOLDER: Replace this SVG or place 'logo.png' in public/ to use your official logo -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1A10" />
      <stop offset="100%" stop-color="#190D06" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Badge Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Waffle Grid & 911 Craving siren badge -->
    <path d="M18 20h24v20H18z" fill="#3D2012" rx="4"/>
    <path d="M24 20v20M30 20v20M36 20v20M18 26h24M18 32h24" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Sparkle / Emergency Flame -->
    <path d="M30 11c1.5 3 4 4.5 4 7 0 2.2-1.8 4-4 4s-4-1.8-4-4c0-2.5 2.5-4 4-7z" fill="url(#goldGrad)"/>
    
    <text x="30" y="52" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" fill="#FBBF24" letter-spacing="1">911</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 24)">
    <text x="0" y="22" font-family="'Playfair Display', serif" font-weight="900" font-size="26" fill="#FFFFFF" letter-spacing="1.5">
      911 <tspan fill="url(#goldGrad)">CAFE</tspan>
    </text>
    <text x="2" y="38" font-family="'Outfit', sans-serif" font-weight="600" font-size="9" fill="#D97706" letter-spacing="3">
      WAFFLES • PANCAKES • BROWNIES
    </text>
  </g>
</svg>
